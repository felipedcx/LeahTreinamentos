<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Léah Treinamentos</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#16161a; --panel2:#1f1f25; --text:#f3f3f5; --muted:#a3a3ad;
    --red:#e50914; --red2:#b20710; --line:#2a2a31;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  a{color:inherit}

  /* Topo */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:20px;padding:14px 4%;
    background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));transition:background .3s}
  header.solid{background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.6)}
  .logo{font-weight:900;letter-spacing:.14em;color:var(--red);font-size:1.35rem;text-decoration:none;white-space:nowrap}
  .logo small{color:var(--text);font-weight:600;letter-spacing:.2em;font-size:.7rem;margin-left:8px}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);border:1px solid #555;border-radius:4px;padding:6px 10px}
  .search input{background:none;border:0;outline:0;color:var(--text);width:170px;font-size:.9rem}

  /* Banner */
  .hero{position:relative;min-height:68vh;display:flex;align-items:flex-end;padding:0 4% 9vh;background:#111 center/cover no-repeat}
  .hero::before{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(11,11,13,.95) 5%,rgba(11,11,13,.45) 55%,rgba(11,11,13,.1)),
               linear-gradient(0deg,var(--bg) 2%,rgba(11,11,13,0) 40%)}
  .hero-inner{position:relative;max-width:560px}
  .tag{color:var(--red);font-weight:800;letter-spacing:.2em;font-size:.75rem;margin-bottom:10px}
  .hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin-bottom:14px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .hero p{color:#dcdce2;font-size:1.05rem;line-height:1.45;margin-bottom:22px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border-radius:5px;font-weight:700;font-size:1rem;text-decoration:none;transition:.15s}
  .btn.play{background:#fff;color:#000}.btn.play:hover{background:#ddd}
  .btn.info{background:rgba(120,120,130,.6)}.btn.info:hover{background:rgba(120,120,130,.4)}
  .btn.red{background:var(--red)}.btn.red:hover{background:var(--red2)}

  /* Fileiras */
  main{position:relative;margin-top:-6vh;padding-bottom:60px}
  .row{margin:0 0 28px}
  .row h2{font-size:1.2rem;font-weight:700;padding:0 4%;margin-bottom:10px}
  .track-wrap{position:relative}
  .track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 4% 16px;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}
  .arrow{position:absolute;top:8px;bottom:16px;width:4%;min-width:34px;z-index:5;font-size:1.8rem;background:rgba(0,0,0,.55);opacity:0;transition:.2s}
  .track-wrap:hover .arrow{opacity:1}
  .arrow.l{left:0}.arrow.r{right:0}
  .card{flex:0 0 auto;width:clamp(150px,17vw,235px);aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;
    background:var(--panel);scroll-snap-align:start;transition:transform .2s, box-shadow .2s;text-align:left}
  .card:hover,.card:focus-visible{transform:scale(1.06);z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.8);outline:2px solid #fff}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card .fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;font-weight:800;font-size:1.05rem;line-height:1.15}
  .card .count{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);font-size:.7rem;padding:3px 7px;border-radius:3px;font-weight:700}
  .card .shade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
  .card .name{position:absolute;left:10px;right:10px;bottom:9px;font-weight:700;font-size:.92rem;line-height:1.15;text-shadow:0 1px 6px #000}

  .status{padding:120px 4% 40px;text-align:center;color:var(--muted);line-height:1.6}
  .status b{color:var(--text)}
  .demo{margin:0 4% 22px;padding:10px 14px;border:1px dashed #6b5b00;background:#2a2400;color:#ffd84d;border-radius:6px;font-size:.88rem}

  /* Série (modal) */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);display:none;overflow-y:auto;padding:4vh 3%}
  .overlay.open{display:block}
  .modal{max-width:1100px;margin:0 auto;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #000;animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .close{position:absolute;right:max(3%,calc(50% - 540px));top:calc(4vh + 12px);z-index:5;width:38px;height:38px;border-radius:50%;background:#000a;font-size:1.3rem}
  .stage{background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .stage.cover{background:#111 center/cover no-repeat}
  .stage.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel),rgba(22,22,26,.2) 60%)}
  .stage .hint{position:relative;text-align:center;padding:20px}
  .info{padding:22px 26px 10px}
  .info h2{font-size:1.7rem;margin-bottom:6px}
  .meta{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .info p{line-height:1.55;color:#d6d6dc;margin-bottom:12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .actions .btn{padding:8px 16px;font-size:.9rem}
  .warn{font-size:.82rem;color:var(--muted);margin-top:8px}
  .eps{padding:8px 26px 28px}
  .eps h3{font-size:1.15rem;margin:14px 0 8px}
  .ep{display:flex;gap:14px;align-items:center;width:100%;padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;border-radius:6px}
  .ep:hover{background:var(--panel2)}
  .ep.active{background:var(--panel2);outline:1px solid var(--red)}
  .ep .n{font-size:1.4rem;color:var(--muted);width:32px;text-align:center;flex:none}
  .ep .ic{flex:none;width:40px;height:40px;border-radius:6px;background:#2d2d35;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .ep .t{flex:1;min-width:0}
  .ep .t b{display:block;font-size:1rem;margin-bottom:2px}
  .ep .t span{color:var(--muted);font-size:.84rem}

  footer{padding:30px 4%;color:#666;font-size:.8rem;text-align:center}
  @media(max-width:640px){.search input{width:100px}.logo small{display:none}.info h2{font-size:1.35rem}}
</style>
</head>
<body>

<header id="top">
  <a class="logo" href="#" id="home">LÉAH<small>TREINAMENTOS</small></a>
  <div class="spacer"></div>
  <label class="search">🔍<input id="q" type="search" placeholder="Buscar treinamento" autocomplete="off"></label>
</header>

<div id="app"><div class="status">Carregando treinamentos…</div></div>

<div class="overlay" id="overlay" aria-hidden="true">
  <button class="close" id="close" aria-label="Fechar">✕</button>
  <div class="modal" id="modal"></div>
</div>

<footer>Léah Estética · Portal de treinamentos</footer>

<script>
/* ============================================================
   CONFIGURAÇÃO  (só isto precisa ser editado)
   Cole aqui o link CSV da planilha publicada (veja o LEIA-ME.md).
   Enquanto estiver vazio, o site roda em MODO DEMONSTRAÇÃO.
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpq6AjRUZz8VKnX2holOX4vPleHEnNA7UG-Sq7ne-D_3B8G2AkLInuJKcRjDjQg-dym3W3x-otYBe2/pub?gid=2078109952&single=true&output=csv";
const SITE_NAME = "Léah Treinamentos";

/* ---------- dados de demonstração ---------- */
const DEMO = [
  {treinamento:"Atendimento Excelente",categoria:"Atendimento",descricao:"Do primeiro contato no WhatsApp até o pós-atendimento: como encantar a cliente em cada etapa.",destaque:"sim",ordem:1,titulo:"Boas-vindas e primeiro contato",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
  {treinamento:"Atendimento Excelente",categoria:"Atendimento",ordem:2,titulo:"Apostila: scripts de atendimento",tipo:"pdf",link:""},
  {treinamento:"Atendimento Excelente",categoria:"Atendimento",ordem:3,titulo:"Como lidar com objeções",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
  {treinamento:"Protocolos de Depilação",categoria:"Procedimentos",descricao:"Passo a passo dos protocolos, cuidados e higienização.",ordem:1,titulo:"Preparação da sala",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
  {treinamento:"Protocolos de Depilação",categoria:"Procedimentos",ordem:2,titulo:"Apostila de protocolos",tipo:"pdf",link:""},
  {treinamento:"Vendas e Pacotes",categoria:"Vendas",descricao:"Como apresentar pacotes e fechar com naturalidade.",ordem:1,titulo:"Apresentando um pacote",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
  {treinamento:"Onboarding de Novas Colaboradoras",categoria:"Onboarding",descricao:"Tudo que você precisa saber na primeira semana.",ordem:1,titulo:"Cultura e valores",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
  {treinamento:"Uso do CRM",categoria:"Onboarding",descricao:"Aprenda a usar o Léah CRM no dia a dia.",ordem:1,titulo:"Visão geral do CRM",tipo:"video",link:"https://www.youtube.com/watch?v=jNQXAC9IVRw"},
];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k==="class") e.className=v; else if (k==="text") e.textContent=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  kids.flat().forEach(c => e.append(c));
  return e;
};
const norm = s => (s||"").toString().trim();
const slug = s => norm(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hue = s => { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%360; return h; };

/* CSV com suporte a aspas, vírgulas e quebras de linha */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){
      if (c==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if (c==='"') q=true;
    else if (c===","){ row.push(cell); cell=""; }
    else if (c==="\n"||c==="\r"){ if (c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if (cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>norm(x)));
}
function rowsToObjects(rows){
  const head = rows[0].map(h=>slug(h).replace(/-/g,""));
  return rows.slice(1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=norm(r[i])); return o; });
}

/* ---------- reconhecimento de links ---------- */
function driveId(u){
  let m = u.match(/\/d\/([\w-]{15,})/) || u.match(/[?&]id=([\w-]{15,})/) || u.match(/folders\/([\w-]{15,})/);
  return m ? m[1] : null;
}
function ytId(u){
  const m = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function coverUrl(u){
  if (!u) return "";
  const id = /drive\.google\.com/.test(u) ? driveId(u) : null;
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w800` : u;
}
/* devolve {embed, open, download, kind} */
function resolveLink(ep){
  const u = ep.link; const tipo = (ep.tipo||"").toLowerCase();
  if (!u) return {kind:"none"};
  const yt = ytId(u);
  if (yt) return {kind:"video", embed:`https://www.youtube-nocookie.com/embed/${yt}?rel=0`, open:`https://www.youtube.com/watch?v=${yt}`};
  if (/drive\.google\.com/.test(u)){
    const id = driveId(u);
    if (/folders\//.test(u) || tipo==="pasta") return {kind:"link", open:u};
    if (id) return {kind: tipo==="video"?"video":"doc", embed:`https://drive.google.com/file/d/${id}/preview`, open:`https://drive.google.com/file/d/${id}/view`, download:`https://drive.google.com/uc?export=download&id=${id}`, drive:true};
  }
  if (/docs\.google\.com/.test(u)){
    return {kind:"doc", embed:u.replace(/\/(edit|view)(\?.*)?$/,"/preview"), open:u, drive:true};
  }
  if (/\.pdf($|\?)/i.test(u)) return {kind:"doc", embed:u, open:u, download:u};
  if (/\.(mp4|webm|ogg)($|\?)/i.test(u)) return {kind:"file", embed:u, open:u};
  return {kind:"link", open:u};
}
const ICON = {video:"▶", doc:"📄", file:"▶", link:"🔗", none:"⏳"};
const LABEL = {video:"Vídeo", doc:"Documento", file:"Vídeo", link:"Link", none:"Em breve"};

/* ---------- carregar dados ---------- */
let SERIES = [];       // [{id,nome,categoria,descricao,capa,destaque,eps:[]}]
let DEMO_MODE = false;

function build(items){
  const map = new Map();
  items.forEach(o=>{
    const nome = o.treinamento; if (!nome) return;
    if (!map.has(nome)) map.set(nome,{id:slug(nome),nome,categoria:o.categoria||"Treinamentos",descricao:"",capa:"",destaque:false,eps:[]});
    const s = map.get(nome);
    if (o.descricao && !s.descricao) s.descricao=o.descricao;
    if (o.capa && !s.capa) s.capa=o.capa;
    if (/^(sim|s|x|1|true)$/i.test(o.destaque||"")) s.destaque=true;
    if (o.categoria && s.categoria==="Treinamentos") s.categoria=o.categoria;
    if (o.titulo || o.link) s.eps.push({ordem:parseFloat(o.ordem)||s.eps.length+1, titulo:o.titulo||"Sem título", tipo:o.tipo||"", link:o.link||"", obs:o.obs||o.observacao||""});
  });
  map.forEach(s=>s.eps.sort((a,b)=>a.ordem-b.ordem));
  return [...map.values()];
}

async function load(){
  try{
    if (!SHEET_CSV_URL){ DEMO_MODE=true; SERIES=build(DEMO); return render(); }
    const r = await fetch(SHEET_CSV_URL, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP "+r.status);
    const rows = parseCSV(await r.text());
    SERIES = build(rowsToObjects(rows));
    render();
  }catch(e){
    $("#app").replaceChildren(el("div",{class:"status"},
      el("b",{text:"Não consegui carregar os treinamentos."}),el("br"),
      "Confira se a planilha está publicada na web (Arquivo → Compartilhar → Publicar na Web → CSV) e se o link no site está certo.",el("br"),
      el("small",{text:String(e.message||e)})));
  }
}

/* ---------- tela inicial ---------- */
function coverEl(s, cls="card"){
  const wrap = el("button",{class:cls,"aria-label":s.nome,onclick:()=>openSeries(s.id)});
  const h = hue(s.nome);
  const fb = el("div",{class:"fallback",style:`background:linear-gradient(160deg,hsl(${h} 70% 32%),hsl(${(h+50)%360} 60% 14%))`,text:s.nome});
  wrap.append(fb);
  if (s.capa){
    const img = el("img",{src:coverUrl(s.capa),alt:"",loading:"lazy",referrerpolicy:"no-referrer"});
    img.onload=()=>fb.remove();
    img.onerror=()=>img.remove();
    wrap.append(img, el("div",{class:"shade"}), el("div",{class:"name",text:s.nome}));
  }
  wrap.append(el("div",{class:"count",text:`${s.eps.length} ${s.eps.length===1?"item":"itens"}`}));
  return wrap;
}

function row(title, list){
  const track = el("div",{class:"track"}, list.map(s=>coverEl(s)));
  const go = d => track.scrollBy({left:d*track.clientWidth*.85,behavior:"smooth"});
  return el("section",{class:"row"},
    el("h2",{text:title}),
    el("div",{class:"track-wrap"},
      el("button",{class:"arrow l","aria-label":"Anterior",text:"‹",onclick:()=>go(-1)}),
      track,
      el("button",{class:"arrow r","aria-label":"Próximo",text:"›",onclick:()=>go(1)})));
}

function render(filter=""){
  const app = $("#app"); app.replaceChildren();
  const f = slug(filter);
  const list = f ? SERIES.filter(s=>slug(s.nome+" "+s.categoria+" "+s.descricao).includes(f)) : SERIES;

  if (!SERIES.length){
    app.append(el("div",{class:"status"},el("b",{text:"Nenhum treinamento cadastrado ainda."}),el("br"),"Adicione linhas na planilha e recarregue a página."));
    return;
  }
  if (f){
    app.append(el("div",{style:"height:90px"}));
    if (!list.length) app.append(el("div",{class:"status",style:"padding-top:30px",text:"Nada encontrado para essa busca."}));
    else app.append(el("main",{style:"margin-top:0"}, row(`Resultados para “${filter}”`, list)));
    return;
  }

  /* banner */
  const hs = SERIES.find(s=>s.destaque) || SERIES[0];
  const hero = el("section",{class:"hero"},
    el("div",{class:"hero-inner"},
      el("div",{class:"tag",text:"EM DESTAQUE"}),
      el("h1",{text:hs.nome}),
      el("p",{text:hs.descricao || `${hs.eps.length} conteúdos para você aprender no seu ritmo.`}),
      el("div",{class:"btns"},
        el("button",{class:"btn play",onclick:()=>openSeries(hs.id,0),text:"▶  Assistir"}),
        el("button",{class:"btn info",onclick:()=>openSeries(hs.id),text:"ⓘ  Mais informações"}))));
  const hc = coverUrl(hs.capa);
  if (hc) hero.style.backgroundImage=`url("${hc}")`;
  else { const h=hue(hs.nome); hero.style.background=`linear-gradient(120deg,hsl(${h} 65% 22%),hsl(${(h+60)%360} 55% 8%))`; }
  app.append(hero);

  const main = el("main");
  if (DEMO_MODE) main.append(el("div",{class:"demo",text:"Modo demonstração: estes são treinamentos de exemplo. Configure o link da planilha no arquivo index.html para mostrar os de verdade."}));
  const cats = [...new Set(SERIES.map(s=>s.categoria))];
  main.append(row("Todos os treinamentos", SERIES));
  cats.forEach(c=>main.append(row(c, SERIES.filter(s=>s.categoria===c))));
  app.append(main);
}

/* ---------- tela da série ---------- */
let current = null, curEp = 0;

function openSeries(id, epIndex=null){
  const s = SERIES.find(x=>x.id===id); if (!s) return;
  current = s; curEp = epIndex ?? -1;
  history.replaceState(null,"",`#${id}`);
  drawModal();
  $("#overlay").classList.add("open"); $("#overlay").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  $("#overlay").scrollTop=0;
}
function closeSeries(){
  $("#overlay").classList.remove("open"); $("#overlay").setAttribute("aria-hidden","true");
  document.body.style.overflow=""; $("#modal").replaceChildren();
  history.replaceState(null,"",location.pathname+location.search);
}

function drawModal(){
  const s=current, m=$("#modal"); m.replaceChildren();
  const ep = curEp>=0 ? s.eps[curEp] : null;
  const info = ep ? resolveLink(ep) : null;

  /* palco */
  const stage = el("div",{class:"stage"});
  if (!ep){
    stage.classList.add("cover");
    const c=coverUrl(s.capa);
    if (c) stage.style.backgroundImage=`url("${c}")`;
    else { const h=hue(s.nome); stage.style.background=`linear-gradient(120deg,hsl(${h} 65% 24%),hsl(${(h+60)%360} 55% 9%))`; }
    stage.append(el("div",{class:"hint"},
      el("button",{class:"btn red",text:"▶  Começar",onclick:()=>{curEp=0;drawModal();}})));
  } else if (info.kind==="video"||info.kind==="doc"){
    stage.append(el("iframe",{src:info.embed,allow:"autoplay; encrypted-media; picture-in-picture; fullscreen",allowfullscreen:"",title:ep.titulo,loading:"lazy"}));
  } else if (info.kind==="file"){
    stage.append(el("video",{src:info.embed,controls:"",autoplay:"",style:"width:100%;height:100%"}));
  } else if (info.kind==="link"){
    stage.append(el("div",{class:"hint"},el("p",{text:"Este conteúdo abre em outra aba."}),el("br"),
      el("a",{class:"btn red",href:info.open,target:"_blank",rel:"noopener",text:"Abrir conteúdo ↗"})));
  } else {
    stage.append(el("div",{class:"hint"},el("b",{text:"Este conteúdo ainda não tem link."}),el("p",{style:"color:#a3a3ad;margin-top:6px",text:"Quem administra precisa preencher a coluna “link” na planilha."})));
  }
  m.append(stage);

  /* informações */
  const box = el("div",{class:"info"});
  box.append(el("h2",{text: ep ? ep.titulo : s.nome}));
  box.append(el("div",{class:"meta",text: ep ? `${s.nome} · Item ${curEp+1} de ${s.eps.length}` : `${s.categoria} · ${s.eps.length} ${s.eps.length===1?"item":"itens"}`}));
  if (!ep && s.descricao) box.append(el("p",{text:s.descricao}));
  if (ep && ep.obs) box.append(el("p",{text:ep.obs}));
  if (ep && info.open){
    const a = el("div",{class:"actions"});
    a.append(el("a",{class:"btn info",href:info.open,target:"_blank",rel:"noopener",text:"Abrir em nova aba ↗"}));
    if (info.download) a.append(el("a",{class:"btn info",href:info.download,target:"_blank",rel:"noopener",text:"⬇ Baixar"}));
    if (curEp<s.eps.length-1) a.append(el("button",{class:"btn red",text:"Próximo ▶",onclick:()=>{curEp++;drawModal();}}));
    box.append(a);
    if (info.drive) box.append(el("div",{class:"warn",text:"Se aparecer “sem permissão”, o arquivo no Drive precisa estar como “Qualquer pessoa com o link pode ver”."}));
  }
  m.append(box);

  /* episódios */
  const eps = el("div",{class:"eps"}, el("h3",{text:"Conteúdo do treinamento"}));
  s.eps.forEach((e,i)=>{
    const r = resolveLink(e);
    eps.append(el("button",{class:"ep"+(i===curEp?" active":""),onclick:()=>{curEp=i;drawModal();$("#overlay").scrollTop=0;}},
      el("div",{class:"n",text:String(i+1)}),
      el("div",{class:"ic",text:ICON[r.kind]}),
      el("div",{class:"t"},el("b",{text:e.titulo}),el("span",{text:LABEL[r.kind]}))));
  });
  m.append(eps);
}

/* ---------- eventos ---------- */
$("#close").onclick = closeSeries;
$("#overlay").addEventListener("click",e=>{ if (e.target.id==="overlay") closeSeries(); });
document.addEventListener("keydown",e=>{ if (e.key==="Escape") closeSeries(); });
$("#home").onclick = e=>{ e.preventDefault(); $("#q").value=""; closeSeries(); render(); window.scrollTo({top:0}); };
$("#q").addEventListener("input",e=>render(e.target.value));
addEventListener("scroll",()=>$("#top").classList.toggle("solid",scrollY>40),{passive:true});
document.title = SITE_NAME;

load().then(()=>{
  const id = location.hash.slice(1);
  if (id && SERIES.some(s=>s.id===id)) openSeries(id);
});
</script>
</body>
</html>
